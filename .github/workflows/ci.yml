# Build, lint, typecheck and test the SDK on every push and pull request, and
# run its agents behind a real Zentinel.
#
# The unit tests passed for months while no agent built with this SDK could
# complete a handshake with the proxy (zentinel#600): they tested the SDK
# against its own idea of the protocol. The conformance job tests it against
# the proxy itself, with the shared harness every SDK runs
# (zentinelproxy/zentinel, sdk-conformance/).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `ci` rather than `install`, so the lockfile is authoritative and a
        # dependency cannot drift underneath the build.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: |
          npm run build
          test -f dist/index.js && test -f dist/v2/index.js && test -f dist/v2/proto/agent_v2.proto

      - name: Test
        run: npm test

  conformance:
    name: Conformance (agent protocol v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the SDK and the example agents
        run: |
          npm ci
          npm run build
          npm run build:examples

      # The conformance agent, over a Unix socket and over gRPC.
      - name: Conformance agent
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          # Build zentinel from main until a release includes zentinel#603
          # (config delivery); then pin `zentinel-version` to that release.
          zentinel-ref: main
          agent-command: node build/examples/conformance-agent.js --socket {socket}
          grpc-agent-command: node build/examples/conformance-agent.js --grpc {grpc}

      # The README quick-start agent, so the README cannot drift from code
      # that works.
      - name: README quick-start agent
        uses: zentinelproxy/zentinel/sdk-conformance@main
        with:
          zentinel-ref: main
          profile: hello
          agent-command: node build/examples/hello-agent.js {socket}
